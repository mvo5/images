          check_gpg: true
          gpgkey: *rhel_signing_key
        - name: "appstream"
          baseurl: "https://cdn.redhat.com/content/dist/rhel10/$releasever/ppc64le/appstream/os"
          rhsm: true
          check_gpg: true
          gpgkey: *rhel_signing_key
      s390x:
        - name: "baseos"
          baseurl: "https://cdn.redhat.com/content/dist/rhel10/$releasever/s390x/baseos/os"
          rhsm: true
          check_gpg: true
          gpgkey: *rhel_signing_key
        - name: "appstream"
          baseurl: https://cdn.redhat.com/content/dist/rhel10/$releasever/s390x/appstream/os"
          rhsm: true
          check_gpg: true
          gpgkey: *rhel_signing_key
      x86_64:
        - name: "baseos"
          baseurl: "https://cdn.redhat.com/content/dist/rhel10/$releasever/x86_64/baseos/os"
          rhsm: true
          check_gpg: true
          gpgkey: *rhel_signing_key
