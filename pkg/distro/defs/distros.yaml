  fedira43_signing_key_x86_64: |
    
  
distros:
  - &fedora
    name: fedora-43
    os_version: 43
    release_version: 43
    platform_id: platform:f43
    product: "Fedora"
    ostree_ref_tmpl: "fedora/43/%s/iot"
    defs: fedora
    # note that this points to fedora-rawhide, not fedora-43
    repos:
      x86_64:
        name: "fedora"
        metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-rawhide&arch=x86_64"
        check_gpg: true
        gpgkey: *fedora43_signing_key_x86_64
      aarch64:
        name: "fedora"
        metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-rawhide&arch=aarch64"
        check_gpg: true
        gpgkey: *fedora43_signing_key_aarch64
      ppc64le:
        name: "fedora"
        metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-rawhide&arch=ppc64le"
        check_gpg: true
        gpgkey: *fedora43_signing_key_ppc64le
      s390x:
        name: "fedora"
        metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-rawhide&arch=s390x"
        check_gpg: true
        gpgkey: *fedora43_signing_key_s390x
  - <<: *fedora
    name: fedora-42
    os_version: 42
    release_version: 42
    platform_id: platform:f42
    # with the dnf var $releasever in the baseurl we can reuse the "repos" accross all
    # of fedora-stable
    # XXX: double check that we can use "$releasever" here
    repos:
      x86_64:
        name: "fedora"
        metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=x86_64"
        check_gpg: true
        gpgkey: *fedora43_signing_key_x86_64
      aarch64:
        name: "fedora"
        metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=aarch64"
        check_gpg: true
        gpgkey: *fedora43_signing_key_aarch64
      ppc64le:
        name: "fedora"
        metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=ppc64le"
        check_gpg: true
        gpgkey: *fedora43_signing_key_ppc64le
      s390x:
        name: "fedora"
        metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=s390x"
        check_gpg: true
        gpgkey: *fedora43_signing_key_s390x
  - <<: *fedora
    name: fedora-41
    os_version: 41
    release_version: 41
    platform_id: platform:f41

  - &rhel_10
    name: rhel-10.1
    product: "Red Hat Enterprise Linux"
    os_version: "10.1"
    release_version: "10"
    module_platform_id: "platform:el10"
    vendor: "redhat"
    ostree_ref_tmpl: "rhel/10/%s/edge"
    defs: "rhel-10"
    # with the dnf var $releasever in the baseurl we can reuse the "repos" accross all
    # of rhel-10
    # XXX: double check that we can use "$releasever" here
    repos:
      aarch64:
        - name: "baseos"
          baseurl: "https://cdn.redhat.com/content/dist/rhel10/$releasever/aarch64/baseos/os"
          rhsm: true
          check_gpg: true
          gpgkey: *rhel_signing_key
        - name: "appstream"
          baseurl: https://cdn.redhat.com/content/dist/rhel10/$releasever/aarch64/appstream/os"
          rhsm: true
          check_gpg: true
          gpgkey: *rhel_signing_key
      ppc64le:
        - name: "baseos"
          baseurl: "https://cdn.redhat.com/content/dist/rhel10/$releasever/ppc64le/baseos/os"
